# Agent-only deployment for a monitored machine (e.g. the home server).
# Exposes the metrics API so a central monitor / dashboard can reach it.
# No Telegram here — alerting lives in the central monitor (one bot token,
# one poller). Copy this file to the server and run:
#   AGENT_PORT=8001 docker compose -f docker-compose.agent.yml up -d

services:
  agent:
    image: hxolmetov/server-snapshot-agent:latest
    ports:
      - "${AGENT_PORT:-8001}:5050"
    pid: "host"
    environment:
      # Watched process names surface in /api/watch for the central monitor.
      WATCH_PROCESSES: ${WATCH_PROCESSES:-dockerd,sshd}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/utmp:/var/run/utmp:ro
    restart: unless-stopped
