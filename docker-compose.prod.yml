# Production compose — pulls prebuilt images from Docker Hub.
# No source code needed on the server: copy this file and run
#   DASHBOARD_PORT=8001 docker compose up -d
# (or put DASHBOARD_PORT in a .env file next to it; default is 8080)

services:
  frontend:
    image: hxolmetov/server-snapshot:latest
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    depends_on:
      - agent
    restart: unless-stopped

  agent:
    image: hxolmetov/server-snapshot-agent:latest
    # pid: host lets the agent see host processes instead of just the container's.
    pid: "host"
    environment:
      # Telegram integration (optional — leave empty to disable).
      # Set these in a .env file next to this compose file.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      ALERT_CPU: ${ALERT_CPU:-90}
      ALERT_MEM: ${ALERT_MEM:-90}
      ALERT_DISK: ${ALERT_DISK:-85}
      # Comma-separated process names to watch, e.g. "dockerd,ngrok,sshd"
      WATCH_PROCESSES: ${WATCH_PROCESSES:-}
      HISTORY_DB: /data/history.db          # persist history across restarts
    volumes:
      # read-only Docker socket → container list + stats on the dashboard
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # host login records → session list + "new login" Telegram alerts
      - /var/run/utmp:/var/run/utmp:ro
      - agent-data:/data
    restart: unless-stopped

  # Public HTTPS tunnel for the dashboard (Telegram Web App needs https).
  # Enabled only with the "ngrok" profile: put COMPOSE_PROFILES=ngrok,
  # NGROK_AUTHTOKEN and NGROK_DOMAIN into .env next to this file.
  ngrok:
    image: ngrok/ngrok:latest
    command: ["http", "frontend:80", "--url", "${NGROK_DOMAIN:-}"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      - frontend
    restart: unless-stopped
    profiles: ["ngrok"]

volumes:
  agent-data:

networks:
  default:
    name: server-snapshot
