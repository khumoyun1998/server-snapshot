# Central monitor + dashboard — runs on an always-on box (e.g. a VPS),
# separate from the machines it watches, so it can report them as DOWN.
# Copy this file + a .env (+ nginx.monitor.conf + servers.json) to the VPS:
#   docker compose -f docker-compose.monitor.yml up -d
#
# .env example:
#   MONITOR_AGENTS=home=http://10.0.0.10:8001
#   TELEGRAM_BOT_TOKEN=...
#   TELEGRAM_CHAT_ID=...
#   DASHBOARD_URL=https://your-domain
#   COMPOSE_PROFILES=ngrok        # to also expose the dashboard over https
#   NGROK_AUTHTOKEN=...           # (needs NGROK_DOMAIN too)
#   NGROK_DOMAIN=your.ngrok-free.app
#
# nginx.monitor.conf proxies /api to the monitored agent so the dashboard
# works over https with no mixed-content; servers.json should use url "".

services:
  dashboard:
    image: hxolmetov/server-snapshot:latest
    ports:
      - "${DASHBOARD_PORT:-80}:80"
    volumes:
      - ./nginx.monitor.conf:/etc/nginx/conf.d/default.conf:ro
      - ./servers.json:/usr/share/nginx/html/servers.json:ro
    restart: unless-stopped

  monitor:
    image: hxolmetov/server-snapshot-agent:latest
    command: ["python", "monitor_service.py"]
    environment:
      MONITOR_AGENTS: ${MONITOR_AGENTS:-}
      MONITOR_INTERVAL: ${MONITOR_INTERVAL:-30}
      MONITOR_FAILS: ${MONITOR_FAILS:-2}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ALERT_CHAT: ${TELEGRAM_ALERT_CHAT:-}
      TELEGRAM_ALERT_THREAD: ${TELEGRAM_ALERT_THREAD:-}
      TELEGRAM_ALLOWED_IDS: ${TELEGRAM_ALLOWED_IDS:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      ALERT_CPU: ${ALERT_CPU:-90}
      ALERT_MEM: ${ALERT_MEM:-90}
      ALERT_DISK: ${ALERT_DISK:-85}
      HTTP_CHECKS: ${HTTP_CHECKS:-}
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
    restart: unless-stopped

  # Optional https tunnel for the dashboard (Telegram Web App). Profile "ngrok".
  ngrok:
    image: ngrok/ngrok:latest
    command: ["http", "dashboard:80", "--url", "${NGROK_DOMAIN:-}"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      - dashboard
    restart: unless-stopped
    profiles: ["ngrok"]
