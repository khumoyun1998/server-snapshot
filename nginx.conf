server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Metrics API — proxy to the monitoring agent.
    # Docker's embedded DNS + a variable makes nginx re-resolve the name,
    # so recreating the agent container doesn't leave nginx with a stale IP.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $agent_upstream http://agent:5050;
        proxy_pass $agent_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets with long cache
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
