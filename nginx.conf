server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Metrics API — proxy to the monitoring agent.
    # AGENT_HOST is resolved by docker-compose service name or host network.
    location /api/ {
        proxy_pass http://agent:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets with long cache
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
