# Dashboard nginx for the central-monitor host.
# /api is proxied to an agent so the dashboard works over https with no
# mixed-content. By default that's the monitor host's own agent (the
# "selfagent" compose service). To also show remote agents, add a
# /agent/<name>/ block (see the commented example) and list them in
# servers.json with url "/agent/<name>".

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Primary agent — servers.json url "". Docker DNS is re-resolved so a
    # restarted agent container doesn't leave a stale IP cached.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $primary http://agent:5050;
        proxy_pass $primary;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        proxy_connect_timeout 10s;
    }

    # Example — a remote agent over your private network (ZeroTier/VPN).
    # servers.json url "/agent/remote".
    # location /agent/remote/api/ {
    #     resolver 127.0.0.11 valid=10s;
    #     set $remote http://10.0.0.20:8001;
    #     rewrite ^/agent/remote(/.*)$ $1 break;
    #     proxy_pass $remote;
    #     proxy_set_header Host $host;
    # }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
