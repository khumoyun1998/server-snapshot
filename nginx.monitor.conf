# Dashboard nginx for the central-monitor host (VPS).
# There is no local agent baked in — /api is proxied to the monitored agent so
# the dashboard works over https with no mixed-content. For extra agents, add a
# /agent/<name>/ block and point that name's servers.json url at /agent/<name>.
#
# Change the addresses below to your agents (host:port over ZeroTier/VPN).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Primary agent — servers.json url "".
    location /api/ {
        proxy_pass http://10.0.0.10:8001;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        proxy_connect_timeout 10s;
    }

    # The monitor host's own agent (the optional "selfagent" service).
    # servers.json url "/agent/vps". Docker DNS is re-resolved so a restarted
    # agent container doesn't leave a stale IP cached.
    location /agent/vps/api/ {
        resolver 127.0.0.11 valid=10s;
        set $vpsagent http://agent:5050;
        rewrite ^/agent/vps(/.*)$ $1 break;
        proxy_pass $vpsagent;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        proxy_connect_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
