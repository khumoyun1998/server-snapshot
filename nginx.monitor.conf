# Dashboard nginx for the central-monitor host (VPS).
# Unlike the all-in-one nginx.conf, there is no local agent here — /api is
# proxied to the MONITORED agent over the private network. Serving the API
# same-origin means the dashboard works over https (ngrok) with no
# mixed-content and no CORS. Set servers.json url to "" to use this proxy.
#
# Change the address below to your agent (host:port over ZeroTier/VPN).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://10.0.0.10:8001;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        proxy_connect_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
