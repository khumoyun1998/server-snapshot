services:
  frontend:
    build: .
    image: hxolmetov/server-snapshot:latest
    ports:
      - "80:80"
    depends_on:
      - agent
    restart: unless-stopped

  agent:
    build: ./server
    image: hxolmetov/server-snapshot-agent:latest
    # pid: host lets the agent see host processes instead of just the container's.
    # Note: full host metrics (CPU/mem of the machine itself) are most accurate
    # when the agent runs directly on the host — the container view is partial.
    pid: "host"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      ALERT_CPU: ${ALERT_CPU:-90}
      ALERT_MEM: ${ALERT_MEM:-90}
      ALERT_DISK: ${ALERT_DISK:-85}
      WATCH_PROCESSES: ${WATCH_PROCESSES:-dockerd,sshd}
      HISTORY_DB: /data/history.db
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/utmp:/var/run/utmp:ro
      - agent-data:/data
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    command: ["http", "frontend:80", "--url", "${NGROK_DOMAIN:-}"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      - frontend
    restart: unless-stopped
    profiles: ["ngrok"]

volumes:
  agent-data:

networks:
  default:
    name: server-snapshot
